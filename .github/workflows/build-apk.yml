name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp -r assets index.html main.js style.css data.js www/

      - name: Initialize & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Surgical Patch: Inject namespace if missing (Capacitor 6 requirement)
          # We check build.gradle in the app module
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "namespace" android/app/build.gradle; then
              sed -i 's/android {/android {\n    namespace "com.antigravity.applemusic"/' android/app/build.gradle
            fi
          fi
          
          npx cap sync android

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-clone-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
