name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --no-package-lock

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp -r assets index.html main.js style.css data.js www/
          ls -R www

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "AppleMusicClone" "com.antigravity.applemusic" --web-dir www
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Surgical Patch: Inject namespace if missing (Capacitor 6 requirement)
          if ! grep -q "namespace" android/app/build.gradle; then
            sed -i 's/android {/android {\n    namespace "com.antigravity.applemusic"/' android/app/build.gradle
          fi
          # Surgical Patch: Setup local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          npx cap sync android --verbose

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-clone-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
