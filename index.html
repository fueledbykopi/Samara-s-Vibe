<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Player - Apple Style</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <div class="dynamic-bg" id="dynamicBg"></div>

        <!-- Tab Content: Library -->
        <main class="content-area">
            <section id="library" class="tab-section active">
                <h1 class="section-title">Library</h1>
                <div class="grid-container" id="libraryGrid">
                    <!-- Cards will be injected here -->
                </div>

                <h2 class="section-title" style="font-size: 20px;">Playlists</h2>
                <div class="grid-container" id="playlistGrid" style="grid-template-columns: repeat(2, 1fr);">
                    <!-- Playlist cards -->
                </div>
            </section>

            <section id="browse" class="tab-section">
                <h1 class="section-title">Browse</h1>
                <div class="grid-container" id="browseGrid">
                    <!-- Browse content -->
                </div>
            </section>

            <section id="radio" class="tab-section">
                <h1 class="section-title">Radio</h1>
                <div class="grid-container" id="radioGrid">
                    <!-- Radio content -->
                </div>
            </section>

            <section id="search" class="tab-section">
                <h1 class="section-title">Search</h1>
                <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center;">
                    <i data-lucide="search" style="margin-right: 10px; opacity: 0.5;"></i>
                    <input type="text" placeholder="Artists, Songs, Lyrics, and More" style="background: none; border: none; color: white; width: 100%; outline: none; font-size: 16px;">
                </div>
                <div class="grid-container" id="searchCategories">
                    <!-- Search categories -->
                </div>
            </section>
        </main>

        <!-- Mini Player -->
        <div class="mini-player" id="miniPlayer">
            <img src="assets/art1.png" alt="Artwork" class="mini-artwork" id="miniArtwork">
            <div class="mini-info">
                <div class="mini-title" id="miniTitle">Song Title</div>
                <div class="mini-artist" id="miniArtist" style="font-size: 12px; color: var(--text-secondary);">Artist Name</div>
            </div>
            <div class="mini-controls">
                <button class="control-btn" id="miniPlayPause">
                    <i data-lucide="play" id="miniPlayIcon"></i>
                </button>
                <button class="control-btn" id="miniForward">
                    <i data-lucide="fast-forward"></i>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="library">
                <i data-lucide="library"></i>
                <span>Library</span>
            </div>
            <div class="nav-item" data-tab="browse">
                <i data-lucide="layers"></i>
                <span>Browse</span>
            </div>
            <div class="nav-item" data-tab="radio">
                <i data-lucide="radio"></i>
                <span>Radio</span>
            </div>
            <div class="nav-item" data-tab="search">
                <i data-lucide="search"></i>
                <span>Search</span>
            </div>
        </nav>

        <!-- Fullscreen Player Drawer -->
        <div class="now-playing-drawer" id="nowPlayingDrawer">
            <div class="drawer-handle" id="closeDrawer"></div>
            
            <!-- Lyrics Overlay -->
            <div class="lyrics-container" id="lyricsContainer"></div>

            <div class="full-artwork-container">
                <img src="assets/art1.png" alt="Full Artwork" class="full-artwork" id="fullArtwork">
            </div>

            <div class="song-details">
                <h1 class="song-title" id="fullTitle">Song Title</h1>
                <p class="song-artist" id="fullArtist">Artist Name</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill" style="width: 30%;"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <button class="control-btn"><i data-lucide="shuffle"></i></button>
                <button class="control-btn" id="prevBtn"><i data-lucide="skip-back" style="width: 32px; height: 32px;"></i></button>
                <button class="control-btn play-pause-btn" id="mainPlayPause">
                    <i data-lucide="play" style="width: 64px; height: 64px;" id="mainPlayIcon"></i>
                </button>
                <button class="control-btn" id="nextBtn"><i data-lucide="skip-forward" style="width: 32px; height: 32px;"></i></button>
                <button class="control-btn"><i data-lucide="repeat"></i></button>
            </div>

            <div class="volume-container">
                <i data-lucide="volume-1" style="opacity: 0.5;"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="80">
                <i data-lucide="volume-2" style="opacity: 0.5;"></i>
            </div>

            <div style="display: flex; justify-content: space-around; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px;">
                <button class="control-btn" id="toggleLyrics"><i data-lucide="quote"></i></button>
                <button class="control-btn"><i data-lucide="airplay"></i></button>
                <button class="control-btn"><i data-lucide="list"></i></button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
