<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samara's Vibe</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="app">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-content">
                <div class="heart-icon"><i data-lucide="heart" fill="currentColor"></i></div>
                <h1 class="welcome-text">i love you bub</h1>
                <p class="welcome-subtext">Welcome to Samara's Vibe</p>
                <button id="startBtn" class="glass-button">Listen Now</button>
            </div>
        </div>

        <!-- Dual background layers for seamless cross-fade -->
        <div class="dynamic-bg active" id="bgLayer1"></div>
        <div class="dynamic-bg" id="bgLayer2"></div>

        <!-- Hidden Media Elements -->
        <div id="ytPlayerContainer" style="position: absolute; top: -9999px; left: -9999px; pointer-events: none;">
            <div id="youtube-player"></div>
        </div>
        <audio id="localAudio" style="display: none;"></audio>
        <video id="localVideo" style="display: none;"></video>

        <!-- Main Content -->
        <main class="content-area">
            <section id="library" class="tab-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h1 class="section-title" style="margin-bottom: 0;">Samara's Vibe</h1>
                    <button id="importBtn" class="action-btn">
                        <i data-lucide="plus"></i>
                        <span>Import</span>
                    </button>
                    <input type="file" id="fileInput" multiple accept="audio/*,video/*" style="display: none;">
                </div>
                
                <div class="grid-container" id="libraryGrid">
                    <!-- Cards will be injected here -->
                </div>
                
                <div id="emptyLibrary" style="text-align: center; padding: 40px 20px; opacity: 0.5;">
                    <i data-lucide="music" style="width: 48px; height: 48px; margin-bottom: 16px;"></i>
                    <p>Your library is empty. Start searching to add some vibes!</p>
                </div>

                <h2 class="section-title" style="font-size: 20px;">Playlists</h2>
                <div class="grid-container" id="playlistGrid" style="grid-template-columns: repeat(2, 1fr);">
                    <!-- Playlist cards -->
                </div>
            </section>

            <!-- Removed Browse and Radio placeholder sections -->

            <section id="search" class="tab-section active">
                <h1 class="section-title">Search</h1>
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" placeholder="Artists, Songs, YouTube Content...">
                </div>
                <div id="searchResults" class="search-results-container">
                    <!-- Search results from YouTube will appear here -->
                </div>
                <div class="grid-container" id="searchCategories">
                    <!-- Search categories -->
                </div>
            </section>
        </main>

        <!-- Mini Player -->
        <div class="mini-player" id="miniPlayer">
            <img src="assets/art1.png" alt="Artwork" class="mini-artwork" id="miniArtwork">
            <div class="mini-info">
                <div class="mini-title" id="miniTitle">Song Title</div>
                <div class="mini-artist" id="miniArtist" style="font-size: 12px; color: var(--text-secondary);">Artist Name</div>
            </div>
            <div class="mini-controls">
                <button class="control-btn" id="miniPlayPause">
                    <i data-lucide="play" id="miniPlayIcon"></i>
                </button>
                <button class="control-btn" id="miniForward">
                    <i data-lucide="fast-forward"></i>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="search">
                <i data-lucide="search"></i>
                <span>Search</span>
            </div>
            <div class="nav-item" data-tab="library">
                <i data-lucide="library"></i>
                <span>Library</span>
            </div>
        </nav>

        <!-- Fullscreen Player Drawer -->
        <div class="now-playing-drawer" id="nowPlayingDrawer">
            <div class="drawer-handle" id="closeDrawer"></div>
            
            <!-- Lyrics Overlay -->
            <div class="lyrics-container" id="lyricsContainer"></div>

            <!-- Media Display Area -->
            <div class="media-display-container">
                <div id="videoContainer" class="video-container"></div>
                <div id="artworkContainer" class="full-artwork-container">
                    <img src="assets/art1.png" alt="Full Artwork" class="full-artwork" id="fullArtwork">
                </div>
            </div>

            <div class="song-details">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1 class="song-title" id="fullTitle">Song Title</h1>
                        <p class="song-artist" id="fullArtist">Artist Name</p>
                    </div>
                    <button class="control-btn" id="toggleVideo" style="opacity: 0.5;">
                        <i data-lucide="tv"></i>
                    </button>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <button class="control-btn"><i data-lucide="shuffle"></i></button>
                <button class="control-btn" id="prevBtn"><i data-lucide="skip-back" style="width: 32px; height: 32px;"></i></button>
                <button class="control-btn play-pause-btn" id="mainPlayPause">
                    <i data-lucide="play" style="width: 64px; height: 64px;" id="mainPlayIcon"></i>
                </button>
                <button class="control-btn" id="nextBtn"><i data-lucide="skip-forward" style="width: 32px; height: 32px;"></i></button>
                <button class="control-btn"><i data-lucide="repeat"></i></button>
            </div>

            <div class="volume-container">
                <i data-lucide="volume-1" style="opacity: 0.5;"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="80">
                <i data-lucide="volume-2" style="opacity: 0.5;"></i>
            </div>

            <div style="display: flex; justify-content: space-around; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px;">
                <button class="control-btn" id="toggleLyrics"><i data-lucide="quote"></i></button>
                <button class="control-btn"><i data-lucide="airplay"></i></button>
                <button class="control-btn"><i data-lucide="list"></i></button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
